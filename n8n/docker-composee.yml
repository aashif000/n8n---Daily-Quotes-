version: '3'
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:ai-beta
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=<your-user>
      - N8N_BASIC_AUTH_PASSWORD=<your-pass>
    volumes:
      - ./n8n:/home/node/.n8n
